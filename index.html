<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zomato</title>
    <link rel="stylesheet" href="./styles/general.css" />
    <link rel="stylesheet" href="./styles/nav.css" />
    <link rel="stylesheet" href="./styles/top.css" />
    <link rel="stylesheet" href="./styles/main.css" />
    <link rel="stylesheet" href="./styles/options.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
      rel="stylesheet"
    />
    <script src="https://unpkg.com/feather-icons"></script>
  </head>
  <body>
    <header id="header">
      <!-- Navbar -->
      <nav id="navbar">
        <!-- Left part -->
        <div id="nav-left" class="nav-item">
          <i data-feather="smartphone"></i>
          <a href="#">Get the app</a>
        </div>
        <div id="nav-right">
          <div class="nav-item">
            <a href="#">Investor Relations</a>
          </div>

          <div class="nav-item">
            <a href="#">Add Account</a>
          </div>

          <div class="nav-item">
            <a href="#">Login</a>
          </div>

          <div class="nav-item">
            <a href="#">Signup</a>
          </div>
        </div>
      </nav>
    </header>

    <main>
      <!-- Top section -->
      <section class="top">
        <img src="./assets/images/bg-img.jpg" alt="bg-img" class="bg-img" />
        <div class="center-content">
          <img
            src="https://b.zmtcdn.com/web_assets/8313a97515fcb0447d2d77c276532a511583262271.png"
            alt="zomatologo"
            class="zomato-logo"
          />
          <h1>
            Discover the best food and drinks in
            <span class="city">Chennai</span>
          </h1>
          <div class="search-container row">
            <div class="location">
              <i data-feather="map-pin" class="map-pin"></i>
              <input
                type="text"
                placeholder="YC, 1, Ashoka Rd, Hanuman Road Area, Connaught Place, New Delhi"
                class="location-input"
              />
              <i data-feather="chevron-down"></i>
            </div>
            <div class="line"></div>
            <div class="search">
              <i data-feather="search" class="search-icon"></i>
              <input
                type="text"
                placeholder="Search for restaurant, cuisine or a dish"
                class="search-box"
              />
            </div>
          </div>
        </div>
      </section>

      <!-- Main Content -->
      <section class="main-content">
        <div class="options">
          <div class="option">
            <img
              src="https://images.unsplash.com/photo-1504674900247-0877df9cc836"
              alt="delivery"
              class="option-img"
            />
            <div class="info">
              <h3 class="info-title">Order Online</h3>
              <p class="info-description">
                Stay home and order on your doorstep
              </p>
            </div>
          </div>
          <div class="option">
            <img
              src="https://images.unsplash.com/photo-1517248135467-4c7edcad34c4"
              alt="delivery"
              class="option-img"
            />
            <div class="info">
              <h3 class="info-title">Dining</h3>
              <p class="info-description">
                View the city's favourite dining venues
              </p>
            </div>
          </div>
          <div class="option">
            <img
              src="https://images.unsplash.com/photo-1517457373958-b7bdd4587205"
              alt="delivery"
              class="option-img"
            />
            <div class="info">
              <h3 class="info-title">Nightlife and Clubs</h3>
              <p class="info-description">
                Explore the city's top nightlife outlets
              </p>
            </div>
          </div>
        </div>
      </section>
    </main>

    <script src="./script.js"></script>
    <script>
      feather.replace();
    </script>
  </body>
</html>
